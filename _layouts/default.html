<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <main>
    {{ content }}
    <footer class="site-footer">
      <p>本サイトは岩井が楽をしたいという非営利目的で作られました。原論文、Abstract、図表等の著作権は各著者・権利者に帰属します。Github リポジトリは<a href="https://github.com/masataka123/geometry-paper-digest">こちら</a>です。</p>
      <p lang="en">Thank you to arXiv for use of its open access interoperability.</p>
    </footer>
  </main>
</body>
</html>
