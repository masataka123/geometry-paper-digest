name: Deploy Astro site to Pages

# Phase 6A safety gate: do not add a push trigger until the first manual
# cutover deployment has passed the production smoke test.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests and content validation
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_posts.py
          python scripts/site_baseline.py
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Validate source and JavaScript
        run: |
          npm run check
          npm run test:js
      - name: Build Astro and Pagefind artifact
        run: npm run build:search
      - name: Validate deployable artifact
        run: |
          npm run test:build
          npm run test:authors
          npm run test:tags
          npm run test:search
          npm run test:pages-cutover
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload only the generated Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
