name: Validate posts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Validate all posts
        run: python scripts/validate_posts.py

      - name: Verify Phase 0 compatibility baseline
        run: python scripts/site_baseline.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Astro dependencies
        run: npm ci

      - name: Check Astro compatibility layer
        run: npm run check

      - name: Run JavaScript unit tests
        run: npm run test:js

      - name: Build Astro compatibility site
        run: npm run build:search

      - name: Validate Astro legacy URLs and content
        run: npm run test:build

      - name: Validate author index and links
        run: npm run test:authors

      - name: Validate tag taxonomy, migration, and pages
        run: npm run test:tags

      - name: Validate Pagefind search index
        run: npm run test:search
