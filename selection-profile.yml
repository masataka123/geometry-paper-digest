ranking_priorities:
  - critical keyword in title
  - multiple critical keywords in abstract
  - direct relevance to Masataka Iwai's current research
  - new general theorem, structure theorem, or inequality
  - main theorem can be stated accurately from PDF or TeX source
  - overlap among math.AG, math.CV, and math.DG
  - preferred author, provided the content is relevant
  - connection among Chern classes, Fano varieties, K-stability, and Kähler geometry
  - connection between singular varieties and differential geometry or analysis

ranking_penalties:
  - minor revision of an existing paper
  - novelty unclear from abstract
  - peripheral relevance to Masataka Iwai's research
  - survey or lecture notes without new results
  - numerical computation only
  - applications or experiments outweigh the mathematical result

selection_rules:
  require_critical_or_high_priority_match: true
  do_not_select_weak_foundational_match: true
  preferred_author_is_not_automatic_top_rank: true
  monge_ampere_and_hessian_contexts:
    - Kähler geometry
    - algebraic geometry
    - cohomology
    - intersection theory
    - stability
    - conditions on subvarieties
  duplicate_arxiv_policy: reject_unless_main_theorem_materially_changed_in_new_version

license_policy:
  mode: license-aware
  permissive_translation_licenses:
    - CC0
    - CC BY
    - CC BY-SA
    - CC BY-NC
    - CC BY-NC-SA
  no_derivatives_licenses:
    - CC BY-ND
    - CC BY-NC-ND
  fallback_for_nonpermissive_license: link-short-quote-if-needed-and-original-japanese-summary
